<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance P2P Live Analysis</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 30px; background: #f4f6f8; color: #333; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 900px; margin: auto; }
        h2 { margin-top: 0; color: #1e2329; border-bottom: 2px solid #f0b90b; padding-bottom: 10px; }
        button { background: #f0b90b; color: #000; border: none; padding: 12px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 15px; transition: all 0.2s; }
        button:hover { background: #d9a608; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #loading { display: none; margin-top: 15px; color: #e67e22; font-weight: 500; }
        #timestamp { display: none; margin-top: 15px; padding: 10px 15px; background: #eef2f5; border-left: 4px solid #f0b90b; border-radius: 4px; font-weight: 600; color: #2c3e50; font-size: 14px; }
        .tables-container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .table-box { flex: 1; min-width: 300px; }
        table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 10px; }
        th, td { border: 1px solid #e6ecf0; padding: 10px 12px; text-align: left; font-size: 14px; }
        th { background-color: #fafafa; color: #485460; font-weight: 600; }
        tr:nth-child(even) { background-color: #fcfcfc; }
    </style>
</head>
<body>

<div class="card">
    <h2>Binance P2P Live Analysis Dashboard</h2>
    <button id="runBtn" onclick="fetchP2PData()">Start Analysis</button>
    <div id="loading">⏳ Scanning Binance P2P orders, please wait...</div>
    <div id="timestamp"></div>

    <div class="tables-container" id="resultsArea" style="display:none;">
        <div class="table-box">
            <h3 id="buyHeader" style="color: #27ae60;">Merchants Selling (BUY)</h3>
            <table>
                <thead><tr><th>Rate</th><th>Count</th><th>Total Volume</th></tr></thead>
                <tbody id="buyTbody"></tbody>
            </table>
        </div>
        <div class="table-box">
            <h3 id="sellHeader" style="color: #c0392b;">Merchants Buying (SELL)</h3>
            <table>
                <thead><tr><th>Rate</th><th>Count</th><th>Total Volume</th></tr></thead>
                <tbody id="sellTbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
async function fetchP2PData() {
    const btn = document.getElementById('runBtn');
    const loading = document.getElementById('loading');
    const timestamp = document.getElementById('timestamp');
    const resultsArea = document.getElementById('resultsArea');

    btn.disabled = true;
    loading.style.display = 'block';
    timestamp.style.display = 'none';
    resultsArea.style.display = 'none';

    try {
        const response = await fetch('/api/p2p-tehlil');
        if (!response.ok) {
            throw new Error(`Server error: ${response.status}`);
        }
        const data = await response.json();

        loading.style.display = 'none';
        btn.disabled = false;

        if (data.timestamp) {
            timestamp.innerText = `🕒 Last Updated (Baku Time): ${data.timestamp}`;
            timestamp.style.display = 'block';
        }

        populateTable('buyTbody', data.buy.intervals);
        populateTable('sellTbody', data.sell.intervals);

        document.getElementById('buyHeader').innerText = `Merchants Selling (BUY) [Ads: ${data.buy.total_ads}]`;
        document.getElementById('sellHeader').innerText = `Merchants Buying (SELL) [Ads: ${data.sell.total_ads}]`;

        resultsArea.style.display = 'flex';

    } catch (error) {
        alert('An error occurred. Ensure the Python Flask server is running and your internet connection is active.');
        loading.style.display = 'none';
        btn.disabled = false;
    }
}

function populateTable(tbodyId, items) {
    const tbody = document.getElementById(tbodyId);
    tbody.innerHTML = '';
    
    if (!items || Object.keys(items).length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No data found</td></tr>';
        return;
    }

    for (const [rate, details] of Object.entries(items)) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><b>${rate}</b></td>
            <td>${details.count}</td>
            <td>${details.usdt.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} USDT</td>
        `;
        tbody.appendChild(tr);
    }
}
</script>

</body>
</html>
